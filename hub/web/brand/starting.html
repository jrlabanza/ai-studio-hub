<!doctype html>
<html lang="en" data-hub-theme="{{theme}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}} · starting</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fraunces:opsz,wght@9..144,300&display=swap");
:root { --bg: #F4F6F9; --panel: #fff; --text: #0B1F45; --muted: #6B7A93; --line: #E5E5E4; --tool: {{color}}; }
:root[data-hub-theme="dark"] { --bg: #061027; --panel: #0B1B3B; --text: #F2F5FA; --muted: #8FA1BF; --line: rgba(255,255,255,.1); }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: "Inter", "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; font-size: 15px; }
.card { width: min(560px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 34px 36px 30px; box-shadow: 0 10px 30px rgba(11,31,69,.08); position: relative; overflow: hidden; }
.num { font-weight: 300; font-size: 60px; line-height: 1; color: transparent; -webkit-text-stroke: 1.5px var(--tool); margin-bottom: 8px; }
h1 { font-family: "Fraunces", Georgia, serif; font-weight: 300; font-size: 32px; margin: 0 0 6px; }
p { margin: 0 0 18px; color: var(--muted); }
.lines { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; display: flex; }
.lines i { flex: 1; display: block; }
.status { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--tool); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.log { margin-top: 16px; background: #0B1F45; color: #d7dfec; border-radius: 10px; padding: 10px 12px; font: 12px/1.45 Consolas, "Cascadia Code", monospace; height: 132px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
.err { color: #D6453D; margin-top: 12px; white-space: pre-wrap; font-size: 14px; }
button { font: inherit; font-weight: 700; padding: 8px 16px; border-radius: 9px; border: 1px solid #1C4991; background: #1C4991; color: #fff; cursor: pointer; margin-top: 12px; }
.elapsed { color: var(--muted); font-weight: 400; margin-left: auto; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="card">
  <div class="num">{{number}}</div>
  <h1>{{name}}</h1>
  <p>{{tagline}}</p>
  <div class="status"><span class="spin" id="spin"></span><span id="status">Starting the studio…</span><span class="elapsed" id="elapsed"></span></div>
  <div class="err" id="err" hidden></div>
  <button id="retry" hidden>Try again</button>
  <div class="log" id="log"></div>
  <div class="lines"><i style="background:#0B1F45"></i><i style="background:#1C4991"></i><i style="background:#34C6A3"></i><i style="background:#11A311"></i><i style="background:#FFC23B"></i></div>
</div>
<script>
(function () {
  var t0 = Date.now(), timer;
  function tick() {
    var s = Math.round((Date.now() - t0) / 1000);
    document.getElementById("elapsed").textContent = s + " s";
  }
  setInterval(tick, 1000);
  function poll() {
    fetch("/__hub/state", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
      document.getElementById("log").textContent = (d.log || []).join("\n");
      var log = document.getElementById("log"); log.scrollTop = log.scrollHeight;
      if (d.theme) document.documentElement.setAttribute("data-hub-theme", d.theme);
      if (d.state === "running") { document.getElementById("status").textContent = "Ready - opening…"; setTimeout(function () { location.reload(); }, 400); return; }
      if (d.held && d.state === "stopped") {
        document.getElementById("spin").style.display = "none";
        document.getElementById("status").textContent = "Paused - " + (d.held_by || "another studio") + " is using the GPU";
        var e2 = document.getElementById("err"); e2.hidden = false; e2.style.color = ""; e2.textContent = "The hub stopped this studio to free the graphics card. It starts again when you open it.";
        var rb = document.getElementById("retry"); rb.hidden = false; rb.textContent = "Start anyway";
      } else if (d.state === "error" || (!d.installed)) {
        document.getElementById("spin").style.display = "none";
        document.getElementById("status").textContent = d.installed ? "Could not start" : "Not set up yet";
        var err = document.getElementById("err"); err.hidden = false; err.textContent = d.installed ? (d.error || "") : (d.install_note || "");
        document.getElementById("retry").hidden = !d.installed;
      } else {
        document.getElementById("status").textContent = d.state === "starting" ? "Starting the studio…" : "Waking up…";
        if (d.state === "stopped" && !d.held) fetch("/__hub/start", { method: "POST" });
      }
      timer = setTimeout(poll, 1500);
    }).catch(function () { timer = setTimeout(poll, 2000); });
  }
  document.getElementById("retry").onclick = function () {
    document.getElementById("err").hidden = true; document.getElementById("retry").hidden = true;
    document.getElementById("spin").style.display = ""; t0 = Date.now();
    fetch("/__hub/start?force=1", { method: "POST" }).then(function () { clearTimeout(timer); poll(); });
  };
  poll();
  window.addEventListener("message", function (e) { if (e.data && e.data.type === "hub:theme") document.documentElement.setAttribute("data-hub-theme", e.data.theme); });
})();
</script>
</body>
</html>
