# Hub override for Forge Studio's linux/compose.yml (merged with it by `docker compose -f a -f b`).
# Only passes the hub's pinned-memory choice through; the studio starts idle on its own.
services:
  forge:
    volumes:
      # the host's Hugging Face cache (HF_HOME) when the hub has one, else <AI_CACHE>/hf (the same as /cache/hf)
      - ${AI_HF_DIR}:/cache/hf
    environment:
      # Pinned (page-locked) host memory for CPU<->GPU transfers; the hub sets it from Settings.
      AI_PIN_MEMORY: ${AI_PIN_MEMORY:-1}
      # Hugging Face's Xet transfer has stalled at 0 B/s inside these containers while plain HTTP runs at full speed
      HF_HUB_DISABLE_XET: "1"
      # the hub owns the GPU queue: no boot warm-up render or automatic previews behind its back
      STUDIO_NO_WARMUP: "1"
